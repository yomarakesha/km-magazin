# Checks only — nothing here deploys. Hosting stays on the Windows box;
# CI runs in GitHub's cloud to gate PRs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # test credentials/DB are set by tests/conftest.py before app import
      - run: python -m pytest tests -q
