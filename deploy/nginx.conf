# nginx site for the shop. Copy to /etc/nginx/sites-available/km-magazin
# and link into sites-enabled. Storefront (km-store/dist) and API share one
# origin, so the backend needs no CORS and the admin cookie stays first-party.
# When the domain is ready: replace "listen 8080" with "listen 80", set
# server_name, then run certbot --nginx -d <domain>.
upstream km_magazin {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /opt/km-magazin/km-store/dist;

    # Product/banner uploads are up to 5 MB each
    client_max_body_size 20m;

    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Backend: API, uploaded media, admin SPA
    location ~ ^/(api|media|admin)(/|$) {
        proxy_pass http://km_magazin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite (do not append): the backend takes the first entry as the client IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Vite assets have hashed names
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Storefront SPA: client-side routes fall back to index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
