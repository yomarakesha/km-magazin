<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KANAGATLY MAHABAT — Blank A · Minimal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --green:#00A650; --green-br:#22e07d; --green-d:#0a6e3b;
    --ink:#0e1512; --tx2:#5b6a63; --tx3:#94a29a;
    --line:rgba(14,21,18,.12);
    --disp:"Unbounded",sans-serif; --body:"Manrope",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#e7ebe8}
  body{font-family:var(--body);color:var(--ink);display:flex;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
  .sheet{position:relative;width:210mm;min-height:297mm;background:#fff;overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.28);display:flex;flex-direction:column;padding:24mm 22mm 20mm}

  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:30px}
  .brand{display:flex;align-items:center;gap:15px}
  .brand img{width:52px;height:52px;border-radius:50%}
  .brand .name{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.1em;line-height:1;white-space:nowrap}
  .brand .tag{font-family:var(--mono);font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--green-d);margin-top:7px}

  .contacts{text-align:right;display:flex;flex-direction:column;gap:9px}
  .ct .lb{font-family:var(--mono);font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--tx3)}
  .ct .vl{font-size:12px;font-weight:600;color:var(--ink);margin-top:1px;line-height:1.35}
  .ct .vl.sm{font-weight:500;color:var(--tx2);font-size:11px;max-width:220px;margin-left:auto}

  .hr{height:2px;background:var(--ink);margin-top:20px;position:relative}
  .hr::after{content:"";position:absolute;left:0;top:0;height:2px;width:64px;background:var(--green)}

  .body{flex:1;padding-top:16mm}
  .ph{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#c7cfca}

  .foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;gap:16px;
    font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3)}
  .foot b{color:var(--ink)}

  @page{size:A4;margin:0}
  @media print{html,body{background:#fff;padding:0}.sheet{box-shadow:none}}
</style>
</head>
<body>
  <div class="sheet">
    <header class="head">
      <div class="brand">
        <img src="km-logo.png" alt="KM" />
        <div><div class="name">KANAGATLY&nbsp;MAHABAT</div><div class="tag">Howpsuzlyk &amp; Tehnologiýa</div></div>
      </div>
      <div class="contacts">
        <div class="ct"><div class="lb">Salgy</div><div class="vl sm">ş. Aşgabat, 10 ýyl abadançylyk, jaý 142, 1-nji gat</div></div>
        <div class="ct"><div class="lb">Tel</div><div class="vl">+993 65 55 55 68</div></div>
        <div class="ct"><div class="lb">Email</div><div class="vl">kanagatlymahabat@gmail.com</div></div>
      </div>
    </header>
    <div class="hr"></div>
    <main class="body"><span class="ph">— letter body —</span></main>
    <footer class="foot">
      <span><b>KANAGATLY MAHABAT</b></span>
      <span>+993 65 55 55 68</span>
      <span>kanagatlymahabat@gmail.com</span>
    </footer>
  </div>
</body>
</html>
