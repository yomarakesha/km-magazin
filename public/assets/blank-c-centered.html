<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KANAGATLY MAHABAT — Blank C · Centered</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --green:#00A650; --green-br:#22e07d; --green-d:#0a6e3b;
    --ink:#0e1512; --tx2:#5b6a63; --tx3:#94a29a;
    --line:rgba(14,21,18,.12); --line2:rgba(10,110,59,.30);
    --disp:"Unbounded",sans-serif; --body:"Manrope",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#e7ebe8}
  body{font-family:var(--body);color:var(--ink);display:flex;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
  .sheet{position:relative;width:210mm;min-height:297mm;background:#fff;overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.28);display:flex;flex-direction:column;padding:22mm 22mm 18mm}
  .sheet::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:70mm;height:5px;
    background:linear-gradient(90deg,transparent,var(--green),transparent)}

  .head{text-align:center;padding-top:6mm}
  .head img{width:64px;height:64px;border-radius:50%;box-shadow:0 10px 26px rgba(0,166,80,.28)}
  .head .name{font-family:var(--disp);font-weight:800;font-size:26px;letter-spacing:.16em;margin-top:16px}
  .head .tagrow{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px}
  .head .tagrow .ln{height:1px;width:52px;background:var(--line2)}
  .head .tagrow .tg{font-family:var(--mono);font-size:9.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--green-d)}

  .contacts{display:flex;justify-content:center;align-items:center;gap:26px;margin-top:20px;flex-wrap:wrap}
  .ct{display:flex;flex-direction:column;align-items:center;gap:2px}
  .ct .lb{font-family:var(--mono);font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--tx3)}
  .ct .vl{font-size:11.5px;font-weight:600;color:var(--ink)}
  .contacts .sep{width:4px;height:4px;border-radius:50%;background:var(--green)}

  .rule{height:1px;background:var(--line);margin-top:20px}

  .body{flex:1;padding-top:16mm}
  .ph{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#c7cfca;text-align:center;display:block}

  .foot{margin-top:auto;text-align:center;padding-top:14px;border-top:1px solid var(--line)}
  .foot .l{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3)}
  .foot .l b{color:var(--green-d)}

  @page{size:A4;margin:0}
  @media print{html,body{background:#fff;padding:0}.sheet{box-shadow:none}}
</style>
</head>
<body>
  <div class="sheet">
    <header class="head">
      <img src="km-logo.png" alt="KM" />
      <div class="name">KANAGATLY&nbsp;MAHABAT</div>
      <div class="tagrow"><span class="ln"></span><span class="tg">Howpsuzlyk &amp; Tehnologiýa</span><span class="ln"></span></div>
      <div class="contacts">
        <div class="ct"><span class="lb">Salgy</span><span class="vl">ş. Aşgabat, jaý 142</span></div>
        <span class="sep"></span>
        <div class="ct"><span class="lb">Tel</span><span class="vl">+993 65 55 55 68</span></div>
        <span class="sep"></span>
        <div class="ct"><span class="lb">Email</span><span class="vl">kanagatlymahabat@gmail.com</span></div>
      </div>
    </header>
    <div class="rule"></div>
    <main class="body"><span class="ph">— letter body —</span></main>
    <footer class="foot"><div class="l"><b>KANAGATLY MAHABAT</b> &nbsp;·&nbsp; ş. Aşgabat, 10 ýyl abadançylyk, jaý 142, 1-nji gat</div></footer>
  </div>
</body>
</html>
